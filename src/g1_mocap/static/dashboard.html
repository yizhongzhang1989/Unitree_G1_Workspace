<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G1 动捕重定向</title>
<style>
  /* [hidden] 会被作者样式里的 display 盖掉，全局补一条 */
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #12151a; color: #d8dee9; font-size: 13px;
    font-family: -apple-system, "Segoe UI", "Noto Sans CJK SC", sans-serif;
  }
  #md-bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 14px; background: #1b1f27; border-bottom: 1px solid #2b313c;
  }
  .md-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 11px; background: #232935; white-space: nowrap;
  }
  .md-dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
  .md-dot.md-ok { background: #4ade80; }
  .md-dot.md-bad { background: #f87171; }
  .md-dot.md-warn { background: #fbbf24; }
  button {
    padding: 5px 14px; border: 1px solid #3b4351; border-radius: 5px;
    background: #2b3240; color: #d8dee9; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #364054; }
  #md-note { margin-left: auto; color: #9aa5b8; }
  #md-note.md-err { color: #f87171; }
  #md-note.md-good { color: #4ade80; }

  body { height: 100dvh; display: flex; flex-direction: column; }
  #md-bar { flex: 0 0 auto; }
  #md-main { display: flex; flex: 1; min-height: 0; }
  #md-view { flex: 1 1 auto; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #md-hint { position: absolute; left: 12px; bottom: 10px; color: #6b7280; pointer-events: none; }
  #md-side {
    flex: 0 0 320px; overflow-y: auto; padding: 10px 12px;
    background: #171b22; border-left: 1px solid #2b313c;
  }
  #md-side h2 { margin: 4px 0 10px; font-size: 12px; color: #9aa5b8; font-weight: 600; }
  /* 列表容器高度是撑出来的，flex 子项默认 shrink 会被压得比内容矮 */
  .md-row { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; margin-bottom: 3px; }
  .md-row .md-name { flex: 0 0 128px; color: #b6c0d0; font-size: 11px; }
  .md-row .md-val { flex: 0 0 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .md-track { flex: 1 1 auto; position: relative; height: 12px; border-radius: 3px; background: #232935; }
  /* 灰带 = 策略见过的大致范围。条跑到它外面就是分布外 */
  .md-band { position: absolute; top: 0; bottom: 0; background: #333c4d; }
  .md-tick { position: absolute; top: -1px; bottom: -1px; width: 2px; background: #7dd3fc; }
  .md-tick.md-out { background: #f87171; width: 3px; }
  button:disabled { opacity: .45; cursor: default; }
  #md-library { border-bottom: 1px solid #2b313c; padding-bottom: 12px; margin-bottom: 14px; }
  .md-library-head { display: flex; align-items: center; justify-content: space-between; }
  #md-refresh, #md-play { width: 34px; height: 32px; padding: 0; flex: 0 0 34px; }
  button svg { width: 16px; height: 16px; vertical-align: middle; }
  #md-motion-search { width: 100%; margin: 6px 0; }
  input[type="search"], select { background: #232935; color: #d8dee9; border: 1px solid #3b4351; border-radius: 4px; padding: 6px; }
  #md-motion-directory { color: #9aa5b8; font-size: 11px; overflow-wrap: anywhere; margin-bottom: 8px; }
  #md-recordings { max-height: 260px; overflow-y: auto; min-height: 34px; }
  .md-motion-row { display: flex; align-items: stretch; gap: 4px; margin-bottom: 4px; }
  .md-motion-item { min-width: 0; flex: 1 1 auto; text-align: left; display: flex; flex-direction: column; gap: 5px; padding: 8px; overflow-wrap: anywhere; }
  .md-motion-item small { color: #9aa5b8; font-size: 10px; }
  .md-motion-item.md-selected { border-color: #66cbbb; background: #213b3b; }
  .md-archive { width: 34px; padding: 0; flex: 0 0 34px; color: #9aa5b8; }
  .md-archive.md-confirm { border-color: #ef6464; color: #ff8585; background: #3a2328; }
  #md-transport { background: #1b1f27; border-top: 1px solid #3b4351; padding: 8px 12px; flex: 0 0 auto; }
  #md-playing-title { display: block; overflow-wrap: anywhere; margin-bottom: 6px; color: #85dece; }
  .md-player-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #md-timeline { flex: 1 1 160px; min-width: 100px; accent-color: #66cbbb; }
  #md-play-time { min-width: 125px; font-variant-numeric: tabular-nums; }
  @media (max-width: 700px) {
    body { height: auto; min-height: 100dvh; }
    #md-main { flex-direction: column; flex: none; }
    #md-view { flex: none; height: 48dvh; min-height: 280px; }
    #md-side { flex: none; width: 100%; border-left: 0; border-top: 1px solid #2b313c; }
    #md-transport { position: sticky; bottom: 0; }
    #md-hint { display: none; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }
</script>
</head>
<body>
<div id="md-bar">
  <span class="md-pill"><span class="md-dot" id="md-link"></span><span id="md-link-t">链路</span></span>
  <span class="md-pill"><span class="md-dot" id="md-body"></span><span id="md-body-t">body</span></span>
  <span class="md-pill"><span class="md-dot" id="md-cal"></span><span id="md-cal-t">未校准</span></span>
  <button id="md-do-cal">校准（人站直）</button>
  <label class="md-pill"><input type="checkbox" id="md-show-human" checked> 人骨架</label>
  <label class="md-pill"><input type="checkbox" id="md-show-robot" checked> G1</label>
  <span id="md-note"></span>
</div>
<div id="md-main">
  <div id="md-view">
    <canvas id="md-canvas"></canvas>
    <div id="md-hint">左键旋转 · 右键平移 · 滚轮缩放</div>
  </div>
  <div id="md-side">
    <section id="md-library">
      <div class="md-library-head"><h2>录制动作 <span id="md-motion-count">0</span></h2><button id="md-refresh" title="刷新列表" aria-label="刷新列表"><i data-lucide="refresh-cw"></i></button></div>
      <input id="md-motion-search" type="search" placeholder="搜索动作" aria-label="搜索动作">
      <div id="md-motion-directory"></div>
      <div id="md-recordings" aria-label="录制动作列表">加载中…</div>
    </section>
    <h2>关节角（蓝=当前，灰带=训练分布，红=越界）</h2>
    <div id="md-joints"></div>
  </div>
</div>
<div id="md-transport" hidden>
  <span id="md-playing-title"></span>
  <div class="md-player-controls">
    <button id="md-play" title="暂停" aria-label="暂停"><i data-lucide="pause"></i></button>
    <input id="md-timeline" type="range" min="0" max="0" step="0.001" value="0" aria-label="回放进度">
    <output id="md-play-time">0.00 / 0.00 s</output>
    <select id="md-speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    <label><input id="md-loop" type="checkbox"> 循环</label>
    <button id="md-live">返回实时</button>
  </div>
</div>
<script src="/vendor/lucide.min.js"></script>
<script type="module">
import * as viewer from "/viewer.js";
import { createPlayback } from "/playback.js";

const note = document.getElementById("md-note");
let layout = null, byName = null, noteHold = 0;
let playback = null;

function say(text, kind) {
  // 30 Hz 轮询会在一瞬间把提示冲掉，要紧的消息给一个保留期
  const now = performance.now();
  if (kind === "idle" && now < noteHold) return;
  if (kind !== "idle") noteHold = now + 4000;
  note.textContent = text;
  note.className = kind === "err" ? "md-err" : (kind === "good" ? "md-good" : "");
}

function buildJoints() {
  const host = document.getElementById("md-joints");
  host.textContent = "";
  for (const joint of layout.joints) {
    const row = document.createElement("div");
    row.className = "md-row";
    row.innerHTML =
      '<span class="md-name"></span><span class="md-track">' +
      '<span class="md-band"></span><span class="md-tick"></span></span>' +
      '<span class="md-val"></span>';
    row.querySelector(".md-name").textContent = joint.name.replace(/_joint$/, "");
    const span = joint.upper - joint.lower;
    // 灰带取 default 两侧各 20% 行程，作为「策略见过的范围」的粗略标记
    joint._low = Math.max(joint.lower, joint.default - 0.2 * span);
    joint._high = Math.min(joint.upper, joint.default + 0.2 * span);
    const band = row.querySelector(".md-band");
    band.style.left = ((joint._low - joint.lower) / span * 100) + "%";
    band.style.width = ((joint._high - joint._low) / span * 100) + "%";
    host.appendChild(row);
    joint._tick = row.querySelector(".md-tick");
    joint._val = row.querySelector(".md-val");
  }
}

function updateJoints(names, values) {
  // 按**名字**取，不按下标：layout 的顺序来自 URDF，消息的顺序来自策略名单，
  // 两者没有理由一致，按下标读就是静默错位。
  if (!byName || byName.length !== names.length || names.some((name, index) => name !== byName[index])) {
    byName = names;
    for (const joint of layout.joints) joint._index = names.indexOf(joint.name);
  }
  for (const joint of layout.joints) {
    if (joint._index < 0) continue;
    const value = values[joint._index];
    const span = joint.upper - joint.lower;
    joint._tick.style.left =
      Math.min(100, Math.max(0, (value - joint.lower) / span * 100)) + "%";
    joint._tick.classList.toggle("md-out", value < joint._low || value > joint._high);
    joint._val.textContent = (value * 57.2958).toFixed(1);
  }
}

function setDot(id, textId, cls, text) {
  document.getElementById(id).className = "md-dot " + cls;
  document.getElementById(textId).textContent = text;
}

async function poll() {
  try {
    const state = await (await fetch("/state", { cache: "no-store" })).json();
    if (playback?.isActive()) return;
    setDot("md-link", "md-link-t", state.connected ? "md-ok" : "md-bad",
           state.connected ? ("头显已连 " + state.frames + " 帧") : "头显未连接");
    setDot("md-body", "md-body-t",
           state.body_status === 1 ? "md-ok" : (state.body_status === 2 ? "md-warn" : "md-bad"),
           "body " + state.body_status + " · " + (state.body_message || ""));
    setDot("md-cal", "md-cal-t", state.calibrated ? "md-ok" : "md-warn",
           state.calibrated ? "已校准" : "未校准");
    if (state.human) viewer.applyHuman(state.human);
    if (state.angles) {
      updateJoints(state.joint_names, state.angles);
      viewer.applyAngles(state.joint_names, state.angles);
    }
    if (state.root_quat) viewer.applyRootQuat(state.root_quat);
    if (typeof state.root_z === "number") viewer.applyRootHeight(state.root_z);
    viewer.frameOnce();
    say(state.error || "", state.error ? "err" : "idle");
  } catch (err) {
    if (!playback?.isActive()) say("后端连不上：" + err.message, "err");
  } finally {
    setTimeout(poll, 33);
  }
}

document.getElementById("md-do-cal").addEventListener("click", async () => {
  say("校准中…", "good");
  try {
    const result = await (await fetch("/calibrate", { method: "POST" })).json();
    say(result.message || (result.ok ? "完成" : "失败"), result.ok ? "good" : "err");
  } catch (err) {
    say("校准请求失败：" + err.message, "err");
  }
});
for (const which of ["human", "robot"]) {
  document.getElementById("md-show-" + which).addEventListener("change", (e) => {
    viewer.setVisible(which, e.target.checked);
  });
}
window.addEventListener("resize", viewer.resize);
new ResizeObserver(viewer.resize).observe(document.getElementById("md-view"));

(async () => {
  lucide.createIcons();
  const model = await (await fetch("/model")).json();
  layout = await (await fetch("/layout")).json();
  buildJoints();
  viewer.buildRobot(model);
  viewer.buildHuman(layout.human_parents);
  viewer.start();
  playback = createPlayback(updateJoints, say);
  poll();
})();
</script>
</body>
</html>
