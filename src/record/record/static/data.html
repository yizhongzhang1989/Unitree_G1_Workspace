<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G1 采集数据管理</title>
<link rel="stylesheet" href="/app.css">
</head>
<body class="with-transport">
<header>
  <h1>采集数据管理</h1>
  <a class="peer" href="/tools.zip"
     title="tools/ + final.urdf，导出机上解开就能用；相机内外参在每次采集自己的 camera_params.yaml 里；用法看里面的 tools/README.md">⤓ 导出工具</a>
  <a id="peer" class="peer" target="_blank" rel="noopener">采集面板 ↗</a>
  <div id="banner" class="banner">连接中…</div>
</header>

<div id="convert" class="export convert-bar"></div>

<main class="workarea">
  <section class="panel tree-pane">
    <h2>已录制 <span class="hint" id="count"></span>
      <button id="pick-all" class="fold">全选</button>
      <button id="pick-none" class="fold pick-none">全不选</button>
    </h2>
    <div id="sessions" class="tree"></div>
  </section>

  <section class="panel detail-pane">
    <div id="detail"><p class="hint">左边点一次采集（最外层那一行）看详情。展开可以单独下载里面的文件。</p></div>
  </section>
</main>

<footer class="transport">
  <div class="bar" id="seek"><div id="prog"></div></div>
  <div class="tbody">
    <div class="tnow">
      <div class="tlabel" id="now-label">未在回放</div>
      <div class="hint" id="ready">检查中…</div>
    </div>
    <div class="tclock" id="clock">0:00 / 0:00</div>
    <label class="hint">速度
      <select id="speed">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
      </select>
    </label>
    <button id="btn-stop" class="icon" title="停止回放" aria-label="停止回放" disabled>■</button>
    <div class="safety">
      <span class="hint warn">FPC需提前启用，停止只停回放不卸力</span>
    </div>
  </div>
</footer>

<script src="/common.js"></script>
<script src="/data.js"></script>
</body>
</html>
