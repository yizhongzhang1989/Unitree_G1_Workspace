<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G1 脚步工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/lucide.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header><div class="identity"><span class="brand">G1</span><div><h1>脚步工作台</h1><span class="sub">FOOTSTEP / CONTROL</span></div></div><span id="connection" class="status">连接中</span></header>
  <nav class="control-bar" aria-label="机器人控制">
    <button data-command="engage"><i data-lucide="plug"></i>接管预备</button>
    <button data-command="track"><i data-lucide="power"></i>启动跟踪</button>
    <button data-command="walk" class="primary"><i data-lucide="play"></i>执行队列</button>
    <button data-command="pause"><i data-lucide="pause"></i>暂停行走</button>
    <span class="toolbar-spacer"></span>
    <button data-command="release"><i data-lucide="square"></i>停止任务</button>
    <button id="estop" class="danger"><i data-lucide="octagon-alert"></i>急停</button>
  </nav>
  <div id="notice" role="status" hidden></div>
  <div id="localization-warning" class="warning" hidden>按计划落地估计 · 无全局位置反馈</div>
  <main>
    <aside class="settings">
      <section><h2>运行状态</h2><div class="status-row"><span>任务</span><strong id="task-state">—</strong></div><div class="status-row"><span>脚步</span><strong id="queue-state">—</strong></div>
        <label>定位参考<select id="localization"><option value="fused">全局 + 局部定位</option><option value="planned">按计划落地估计</option></select></label>
        <label>巡航频率 <output id="frequency-label">1.20 Hz</output><input id="frequency" type="range" min="0.8" max="1.8" step="0.02" value="1.2"></label>
      </section>
      <section><h2>简单脚步</h2><label>距离 / m<input id="distance" type="number" min="0" max="0.35" step="0.01" value="0.10"></label>
        <div class="direction-pad"><button data-direction="forward" title="向前" aria-label="向前"><i data-lucide="arrow-up"></i></button><button data-direction="left" title="向左" aria-label="向左"><i data-lucide="arrow-left"></i></button><span class="pad-center"><i data-lucide="footprints"></i></span><button data-direction="right" title="向右" aria-label="向右"><i data-lucide="arrow-right"></i></button><button data-direction="backward" title="向后" aria-label="向后"><i data-lucide="arrow-down"></i></button></div>
        <label>转角 / °<input id="turn" type="number" min="-90" max="90" step="5" value="15"></label><button data-direction="rotate" class="full"><i data-lucide="rotate-ccw"></i>加入原地转向</button>
        <button data-direction="stand" class="full" title="追加下一脚并齐落点"><i data-lucide="footprints"></i>站定</button>
      </section>
      <section><h2>路线参数</h2><div class="field-pair"><label>采样间距 / m<input id="spacing" type="number" min="0.02" max="0.35" step="0.01" value="0.18"></label><label>站距 / m<input id="width" type="number" min="0.12" max="0.36" step="0.01" value="0.24"></label></div><label class="check"><input id="follow" type="checkbox" checked>朝向跟随路线</label></section>
    </aside>
    <section class="scene">
      <div class="scene-toolbar"><div class="segmented" role="group" aria-label="规划模式"><button data-mode="select" class="selected" title="选择脚步"><i data-lucide="mouse-pointer-2"></i><span>选择</span></button><button data-mode="route" title="绘制路线"><i data-lucide="route"></i><span>路线</span></button><button data-mode="custom" title="自定义脚步"><i data-lucide="footprints"></i><span>脚步</span></button></div><div class="scene-tools"><button id="undo" class="icon" title="撤销草稿" aria-label="撤销草稿"><i data-lucide="undo-2"></i></button><button id="discard" class="icon" title="清空草稿" aria-label="清空草稿"><i data-lucide="eraser"></i></button><button id="zoom-out" class="icon" title="缩小" aria-label="缩小"><i data-lucide="zoom-out"></i></button><button id="zoom-in" class="icon" title="放大" aria-label="放大"><i data-lucide="zoom-in"></i></button></div></div>
      <div class="map"><canvas id="map" aria-label="机器人中心脚印规划视图"></canvas><div class="map-caption"><span>机器人中心</span><span>前向 +X / 左向 +Y</span></div><div id="map-empty" hidden>等待接管预备</div></div>
      <div class="scene-readout"><span><b id="phase">—</b> rad</span><span><b id="actual-frequency">—</b> Hz</span></div>
      <div class="legend"><span class="left-dot">左脚</span><span class="right-dot">右脚</span><span class="hold-dot">计划站姿</span><span class="locked-dot">已承诺</span><span class="draft-dot">草稿</span><span class="anchor-dot">支撑参考</span></div>
      <div class="draft-bar"><span id="draft-count">无草稿</span><button id="commit" class="primary"><i data-lucide="list-plus"></i>加入队列</button></div>
      <form id="pose-editor" hidden><h2 id="selected-title">脚步</h2><div class="pose-fields"><label>世界 X / m<input id="pose-x" type="number" step="0.01"></label><label>世界 Y / m<input id="pose-y" type="number" step="0.01"></label><label>世界 yaw / °<input id="pose-yaw" type="number" step="1"></label></div><button id="apply-pose" type="submit"><i data-lucide="check"></i>更新草稿</button><button id="remove-pose" type="button" class="icon" title="删除末尾草稿脚步" aria-label="删除末尾草稿脚步"><i data-lucide="trash-2"></i></button></form>
    </section>
    <aside class="queue-panel"><div class="queue-heading"><h2>脚步队列 <span id="queue-count">0</span></h2><button id="edit-pending" class="icon" title="编辑待执行脚步" aria-label="编辑待执行脚步"><i data-lucide="pencil"></i></button><button id="clear-pending" class="icon" title="清空待执行脚步" aria-label="清空待执行脚步"><i data-lucide="list-x"></i></button></div><div class="queue-section-label">已承诺 <i data-lucide="lock-keyhole"></i></div><ol id="committed-list"></ol><div class="queue-section-label">待执行</div><ol id="pending-list"></ol><div id="queue-empty">队列为空</div><div class="queue-footer"><span>站立保持</span><b id="hold">—</b></div></aside>
  </main>
  <dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title">确认操作</h2><p id="confirm-text"></p><div class="dialog-actions"><button value="cancel">取消</button><button id="confirm-accept" value="ok" class="danger">确认</button></div></form></dialog>
</body>
</html>
