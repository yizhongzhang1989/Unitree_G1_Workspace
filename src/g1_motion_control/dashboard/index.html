<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>双臂监控 · g1_motion_control</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three.module.js",
        "three/addons/": "/vendor/addons/"
      }
    }
  </script>
</head>

<body>
  <canvas id="viewer"></canvas>

  <div id="hud">
    <span class="pill" id="conn">连接中…</span>
    <span class="pill" id="state">—</span>
    <span class="pill" id="warn" hidden></span>
  </div>

  <div id="panel">
    <div class="row head">
      <span>双臂末端</span>
      <span class="hint">拖拽旋转 · 滚轮缩放 · 右键平移</span>
    </div>

    <table>
      <thead>
        <tr>
          <th></th>
          <th>x</th>
          <th>y</th>
          <th>z</th>
          <th>位置差</th>
        </tr>
      </thead>
      <tbody>
        <tr data-side="left">
          <th>左 上层</th>
          <td class="n tx"></td>
          <td class="n ty"></td>
          <td class="n tz"></td>
          <td></td>
        </tr>
        <tr data-side="left" class="sub cmd">
          <th>左 限速</th>
          <td class="n ax"></td>
          <td class="n ay"></td>
          <td class="n az"></td>
          <td class="n gap"></td>
        </tr>
        <tr data-side="left" class="sub track">
          <th>左 实测</th>
          <td class="n mx"></td>
          <td class="n my"></td>
          <td class="n mz"></td>
          <td class="n gap"></td>
        </tr>
        <tr data-side="right">
          <th>右 上层</th>
          <td class="n tx"></td>
          <td class="n ty"></td>
          <td class="n tz"></td>
          <td></td>
        </tr>
        <tr data-side="right" class="sub cmd">
          <th>右 限速</th>
          <td class="n ax"></td>
          <td class="n ay"></td>
          <td class="n az"></td>
          <td class="n gap"></td>
        </tr>
        <tr data-side="right" class="sub track">
          <th>右 实测</th>
          <td class="n mx"></td>
          <td class="n my"></td>
          <td class="n mz"></td>
          <td class="n gap"></td>
        </tr>
      </tbody>
    </table>

    <div class="row legend">
      <span><i class="sw solid"></i>上层命令（VR / VLA）</span>
      <span><i class="sw limited"></i>IK + 限速</span>
      <span><i class="sw hollow"></i>实测模型末端</span>
    </div>
    <div class="row legend">
      <span>手臂网格 = <b>/joint_states</b> 实测位形</span>
    </div>

    <div class="row">
      <label><input type="checkbox" id="opt-mesh" checked> 网格</label>
      <label><input type="checkbox" id="opt-command" checked> 上层</label>
      <label><input type="checkbox" id="opt-limited" checked> 限速</label>
      <label><input type="checkbox" id="opt-measured" checked> 实测</label>
      <button id="fit" type="button">复位视角</button>
    </div>

    <div class="row foot">
      <span id="ikms">—</span>
      <span id="fps">—</span>
    </div>
  </div>

  <script type="module" src="/dashboard.js"></script>
</body>

</html>
