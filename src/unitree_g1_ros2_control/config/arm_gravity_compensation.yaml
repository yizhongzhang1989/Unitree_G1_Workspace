/arm_gravity_compensation:
  ros__parameters:
    # Same 31-joint layout as the forward position controller: the target and
    # the republished command are both full-body arrays in this order.
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
      - waist_yaw_joint
      - waist_roll_joint
      - waist_pitch_joint
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
      - left_eccentric_joint
      - right_eccentric_joint

    # Written by arm_gravity_compensation after a calibration run.
    gravity_table: package://arm_gravity_compensation/config/gravity_table.yaml

    command_topic: /forward_position_controller/commands

    # 重力方向取自躯干 IMU 的融合姿态（四元数），再经一阶低通。
    gravity_filter_cutoff_hz: 2.0

    # 激活时把偏移从 0 线性升到全量，避免命令阶跃造成力矩冲击。
    offset_ramp_s: 2.0

    # 整体补偿倍率，可运行时调整：
    #   ros2 param set /arm_gravity_compensation compensation_scale 0.95
    # 标定残留的共模误差只有手臂浮起来后才看得出（表现为缓慢上飘或下沉），
    # 靠手感拧到位比重新辨识快得多。
    compensation_scale: 1.0
