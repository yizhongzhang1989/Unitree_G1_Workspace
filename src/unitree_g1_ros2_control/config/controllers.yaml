controller_manager:
  ros__parameters:
    update_rate: 500

    # ros2_control_node 用这三个参数装配自己的实时环路。不设的话 500 Hz 循环跑在
    # 普通 SCHED_OTHER 上，和 dashboard 的 Flask、IK 求解、相机 JPEG 编码抢同一批
    # 时间片——这正是控制环抖动的主要来源。容器已放开 rtprio=99 和 memlock=-1。
    thread_priority: 50
    # 默认值跟随 has_realtime_kernel()，而本机内核是 PREEMPT 不是 PREEMPT_RT，
    # 所以必须显式打开才会 mlockall。失败只会打警告，不影响启动。
    lock_memory: true
    # cpu_affinity 故意不设：本机 8 核，钉核的收益要靠实测，且钉错会挤压
    # canalystii_native_bridge 的 USB 收发线程。需要时用
    #   ros2 param set /controller_manager cpu_affinity [6,7]
    # 之类先量一轮再固化。

    joint_state_broadcaster:
      type: unitree_g1_broadcasters/JointStateBroadcaster

    pelvis_imu_broadcaster:
      type: unitree_g1_broadcasters/ImuSensorBroadcaster

    left_ft_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    right_ft_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    forward_position_controller:
      type: unitree_g1_forward_command_controller/ForwardCommandController

    joint_trajectory_controller:
      type: unitree_g1_joint_trajectory_controller/JointTrajectoryController
