/forward_position_controller:
  ros__parameters:
    # 重力前馈直接跑在这个 500 Hz 环路里：偏移量必须每拍跟随躯干姿态，
    # 经话题转发一次就会被 executor 抖动重采样。
    # 由 arm_gravity_compensation 标定后导出；留空即关闭补偿。
    gravity_table: package://arm_gravity_compensation/config/gravity_table.yaml

    # 重力方向取自躯干 IMU 的融合姿态（四元数），再经一阶低通。
    gravity_filter_cutoff_hz: 2.0

    # 激活时把偏移从 0 线性升到全量，避免命令阶跃造成力矩冲击。
    offset_ramp_s: 2.0

    # 整体补偿倍率，可运行时调整：
    #   ros2 param set /forward_position_controller compensation_scale 0.95
    # 标定残留的共模误差只有手臂浮起来后才看得出（表现为缓慢上飘或下沉），
    # 靠手感拧到位比重新辨识快得多。0.0 就是纯转发行为。
    compensation_scale: 1.0

    # ---------------------------------------------------------------- #
    # 摩擦前馈
    # ---------------------------------------------------------------- #
    # 症状是"目标点在动、手臂不动，差到一定程度才突然跟上"。死区是 2*tau_f/kp，
    # 2026-08-19 实测肩部 5.6~8.2 度（kp 翻倍也还有 2.8~4.1 度），40 cm 臂展下
    # 就是 5.6 cm / 2.8 cm，精细动作全废在这上面。
    # 1.0 是"按模型全额补偿"，不是上限
    friction_scale: 0.95

    # 摩擦系数由 arm_gravity_compensation 标定后导出到独立的 friction_table.yaml，
    # 与重力表分开：摩擦是驱动器特性而非连杆参数，而重力表还被力传感器补偿和负载
    # 估计读，它们都用不到摩擦。文件里带着关节名，加载时与重力表逐个比对，对不上
    # 直接拒绝——这是拆成两个文件后补回来的一致性保证。
    # 留空 = 不做摩擦补偿（回到这一项存在之前的行为）。
    friction_table: package://arm_gravity_compensation/config/friction_table.yaml

    # 摩擦不是常数而是正比于关节载荷（肩部实测相关系数 0.90~0.96），这是减速器
    # 载荷相关损耗的典型特征。逐关节而非全臂统一，是因为跨关节差异比载荷差异还
    # 大：mu 实测从右腕 roll 的 0.064 到右腕 yaw 的 0.223，差 3.5 倍；统一值会让
    # 一头过补另一头欠补，表现就是"有的关节跟得上、有的跟不上，轨迹整体偏掉"。
    #
    # ⚠ friction_load_ratio / friction_offset_nm **不能写在这里**。空的 YAML 列表
    # 没有类型，rclcpp 声明时会试图把它转成 vector<double> 并直接 abort 整个
    # ros2_control_node（症状：spawner 全部超时，看不出是参数问题）。不写 = 用
    # friction_table.yaml 里标定出来的值；临时覆盖用命令行，长度必须正好 14
    # （**左臂 7 轴然后右臂 7 轴**）：
    #   ros2 param set /forward_position_controller friction_load_ratio "[...14 个...]"
    #
    # tau_f[j] = load_ratio[j] * |tau_gravity[j]| + offset[j]

    # tanh 的驱动量是两项相加： error/eps_e + v_target/eps_v。不能用 sign()——
    # 过零时命令会跳一整个死区，正好是让关节自激的激励。
    #
    # **主导的是误差项**。死区的本质就是误差攻到 kp*e > tau_f 才动，所以不管
    # 目标多慢，误差都会长到整个死区宽。只用目标速度则恰恰在精细动作时失效：
    # 末端 5 mm/s 在关节上约 0.0125 rad/s，eps_v=0.02 下 tanh 只给 55%；1 mm/s 只给 12%。
    #
    # eps_e 还决定了它在死区内额外提供多少刚度（tau_f/eps_e，叠在 kp 上），所以调小
    # 是拿阻尼比换死区。kd 不会跟着涨，调过头就会振。任一项置 0 即关掉该项。
    friction_error_epsilon: 0.05
    friction_velocity_epsilon: 0.02

    # 目标速度的一阶低通。速度本身是按"目标保持不变的时长"算的（上层 50 Hz、
    # 这里 500 Hz，逐拍差分会得到 1/10 占空比的脉冲串），这个滤波只是再抹一道。
    target_velocity_cutoff_hz: 5.0

    # ---------------------------------------------------------------- #
    # 误差自适应刚度
    # ---------------------------------------------------------------- #
    # kp' = kp * (1 + scale / ((|e| / b)^power + 1))，kd' = kd * sqrt(kp'/kp)
    #
    # 死区宽 2*tau_f/kp，精细动作要的是更大的 kp；但全程加大要付阻尼比
    # （zeta ~ kd/sqrt(kp)），而大误差处不需要那份刚度。尾部回到标称 kp、永不
    # 低于，所以力矩不封顶，顶住物体时能推到 25 N·m 的电机上限。

    # 零误差处的额外倍数：2.0 = 截距 3 倍，0.0 = 关闭。嫌硬就往回退：
    #   ros2 param set /forward_position_controller adaptive_stiffness_scale 1.0
    adaptive_stiffness_scale: 2.0

    # 半衰误差（rad），与 scale 正交：前者只管强度、后者只管作用范围。误差先被
    # 它归一化再取幂，所以改 power 不会挪动半衰点。
    # 0.08 rad = 4.6 度，配 scale=2 power=3 时 5 度处 1.87 倍、10 度处 1.18 倍。
    adaptive_stiffness_b: 0.08

    # 尾巴的陡峭度：|e| >> b 后残留 ~ (b/|e|)^power，所以 45 度相对 10 度的残留
    # 1 -> 22%（这是下限，b 怎么调都一样）、2 -> 4.9%、3 -> 1.1%。代价是过渡带里
    # 增量刚度凹陷：scale=2 时 power=2 凹到 0.75*kp、power=3 凹到 0.33*kp
    # （在 |e|=0.10 rad）。仍为正所以不失稳，再大就会转负。
    adaptive_stiffness_power: 3.0

    # 激活淡入与重力偏移共用 offset_ramp_s：kp 先到而偏移还在爬坡的话，那一拍
    # 的力矩就对不上。